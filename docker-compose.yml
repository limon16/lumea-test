services:
  postgres:
    image: postgres:16-alpine
    container_name: lumea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumea
      POSTGRES_PASSWORD: lumea
      POSTGRES_DB: lumea
    ports:
      - "5432:5432"
    volumes:
      - lumea-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumea-pgdata:
